root = "."
tmp_dir = ".air_tmp"

[build]
cmd = "go build -o ./.air_tmp/new-api.exe ."
bin = ".air_tmp/new-api.exe"
full_bin = ".air_tmp/new-api.exe"
include_ext = ["go", "tpl", "tmpl", "html", "yaml", "yml", "json"]
exclude_dir = ["node_modules", "logs", ".git", ".air_tmp", "data"]
delay = 500
stop_on_error = true

[log]
time = true
