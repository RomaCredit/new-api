services:
  mysql:
    image: mysql:8.4
    container_name: new-api-local-mysql
    restart: unless-stopped
    ports:
      # Local dev: bind host 3306 → container 3306 (stop other MySQL on this port first)
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: local_dev_password
      MYSQL_DATABASE: "new-api"
      MYSQL_USER: newapi
      MYSQL_PASSWORD: local_dev_password
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - local_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -plocal_dev_password --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  local_mysql_data:
