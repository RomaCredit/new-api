# Optional: push your fork's new-api image to GHCR (uses GITHUB_TOKEN only).
# Enable in repo Settings → Actions → General → Workflow permissions: Read and write.
# Use only if production compose uses a registry image: set server compose new-api `image:` to ghcr.io/<owner>/new-api:<tag>
# If the package is private, run on the server once: docker login ghcr.io -u <user> -p <PAT with read:packages>

name: Publish new-api to GHCR

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image ref (GHCR requires lowercase)
        run: echo "IMAGE_REF=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve tag
        id: meta
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=sha-${GITHUB_SHA:0:7}" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64
          tags: |
            ${{ env.IMAGE_REF }}:${{ steps.meta.outputs.tag }}
          provenance: false
          sbom: false

      - name: Summary
        run: |
          echo "Pushed: ${IMAGE_REF}:${{ steps.meta.outputs.tag }}" >> "$GITHUB_STEP_SUMMARY"
